services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basil_mail}
      POSTGRES_USER: ${POSTGRES_USER:-basil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basil}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basil}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # Lets callbacks reach services running on the Docker host via
    # http://host.docker.internal:<port> (works on Linux, macOS, Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Host port is configurable with WEB_PORT (default 8000). To publish
    # nothing on the host (e.g. behind nginx on an internal network),
    # apply the docker-compose.no-ports.yml override (WEB_PORT empty).
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file: .env
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
